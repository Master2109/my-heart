<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SYSTEM CRITICAL ALERT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            background-color: black;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            cursor: pointer;
        }

        /* Container kuu ya Skrini */
        #screen {
            width: 100vw;
            height: 100vh;
            background-color: black;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
        }

        /* ⚠️ Hazard Notification Banner za Juu */
        #hack-banner {
            display: none;
            position: absolute;
            top: 25px;
            width: 90%;
            max-width: 550px;
            background-color: rgba(200, 0, 0, 0.95);
            color: white;
            padding: 12px 15px;
            border: 3px solid black;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.9);
            border-radius: 8px;
            text-align: center;
            font-size: clamp(0.9rem, 4vw, 1.4rem);
            font-weight: bold;
            letter-spacing: 2px;
            z-index: 20;
            animation: flash-red 0.5s infinite alternate;
        }

        /* Canvas ya Chengachenga na Namba */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            z-index: 2;
        }

        /* Hazard Background Pattern (Emoji / Sticker za kuogopesha) */
        #hazard-bg {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.18;
            font-size: clamp(1.8rem, 6vw, 3.5rem);
            word-wrap: break-word;
            line-height: 1.2;
            overflow: hidden;
            animation: shake 0.3s infinite alternate;
        }

        /* Maandishi ya ARE YOU SCARED? */
        #scared-text {
            display: none;
            font-size: clamp(1.8rem, 8vw, 4rem);
            font-weight: 900;
            color: #8b0000;
            text-transform: uppercase;
            letter-spacing: 3px;
            z-index: 10;
            text-align: center;
            animation: glitch-text 0.2s infinite alternate;
            text-shadow: 3px 3px 0px black, -2px -2px 0px red;
            margin-top: 50px;
            width: 100%;
            word-break: break-word;
        }

        /* Animations */
        @keyframes flash-red {
            0% { background-color: rgba(150, 0, 0, 0.95); transform: scale(1); }
            100% { background-color: rgba(255, 0, 0, 1); transform: scale(1.02); box-shadow: 0 0 30px red; }
        }

        @keyframes shake {
            0% { transform: translate(2px, 2px) rotate(0deg); }
            50% { transform: translate(-2px, -2px) rotate(-1deg); }
            100% { transform: translate(2px, -1px) rotate(1deg); }
        }

        @keyframes glitch-text {
            0% { transform: scale(1) skewX(0deg); }
            50% { transform: scale(1.02) skewX(2deg); color: red; }
            100% { transform: scale(0.98) skewX(-2deg); color: black; }
        }
    </style>
</head>
<body>

    <div id="screen">
        <!-- Notification ya Hazard Juu -->
        <div id="hack-banner">⚠️ HAZARD ALERT: YOU ARE HACKED! ⚠️</div>

        <!-- Hazard Emoji/Stickers Background -->
        <div id="hazard-bg"></div>

        <!-- Canvas ya Glitch + Numbers -->
        <canvas id="noiseCanvas"></canvas>

        <!-- Maandishi ya Horrifying Question -->
        <h1 id="scared-text">☠️️ ARE YOU SCARED? ☠️</h1>
    </div>

    <script>
        const screen = document.getElementById('screen');
        const canvas = document.getElementById('noiseCanvas');
        const ctx = canvas.getContext('2d');
        const hackBanner = document.getElementById('hack-banner');
        const hazardBg = document.getElementById('hazard-bg');
        const scaredText = document.getElementById('scared-text');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();

        // Jaza background na Sticker / Emoji za Hazard
        const hazardEmojis = ["⚠️", "☠️", "☣️", "☢️", "🩸", "💀", "⛔", "🚨"];
        let bgContent = "";
        for (let i = 0; i < 400; i++) {
            bgContent += hazardEmojis[Math.floor(Math.random() * hazardEmojis.length)] + " ";
        }
        hazardBg.innerText = bgContent;

        // --- AUDIO ENGINE ---
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 1. Kishindo cha "PUUH!"
        function playPuuhSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(120, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);

            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 1.5);
        }

        // 2. Sauti Nzito "FINISHED!"
        function speakFinished() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance("FINISHED!");
                utterance.pitch = 0.1; // Pitch ya chini (Monster voice)
                utterance.rate = 0.6;  // Ongea taratibu
                utterance.volume = 1;

                const voices = window.speechSynthesis.getVoices();
                const deepVoice = voices.find(v => v.lang.includes('en') && v.name.toLowerCase().includes('male')) || voices[0];
                if (deepVoice) utterance.voice = deepVoice;

                window.speechSynthesis.speak(utterance);
            }
        }

        // 3. Kicheko cha Kutisha (Horror Laugh)
        function playHorrorLaugh() {
            initAudio();
            const laughCount = 6;
            let time = audioCtx.currentTime + 0.1;

            for (let i = 0; i < laughCount; i++) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sawtooth';
                const startFreq = 100 - (i * 5);
                osc.frequency.setValueAtTime(startFreq, time);
                osc.frequency.exponentialRampToValueAtTime(startFreq - 35, time + 0.28);

                gain.gain.setValueAtTime(0, time);
                gain.gain.linearRampToValueAtTime(0.8, time + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, time + 0.28);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(time);
                osc.stop(time + 0.28);

                time += 0.35;
            }
        }

        // Trigger Sauti na Kicheko
        async function triggerVoiceAndLaugh() {
            initAudio();
            speakFinished();
            await delay(1500);
            playHorrorLaugh();
        }

        // Chengachenga na Namba za Hex
        function drawSlowNoiseAndNumbers() {
            const imgData = ctx.createImageData(canvas.width, canvas.height);
            const buffer = new Uint32Array(imgData.data.buffer);
            
            for (let i = 0; i < buffer.length; i++) {
                if (Math.random() < 0.4) {
                    buffer[i] = 0xffffffff;
                } else {
                    buffer[i] = 0xff000000;
                }
            }
            ctx.putImageData(imgData, 0, 0);

            // Ukubwa wa font ya namba kulingana na skrini
            const fontSize = Math.max(14, Math.floor(window.innerWidth / 30));
            ctx.font = `${fontSize}px monospace`;
            
            for (let i = 0; i < 25; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? "rgba(0, 255, 0, 0.85)" : "rgba(255, 0, 0, 0.85)";
                const randomHex = "0x" + Math.floor(Math.random()*16777215).toString(16).toUpperCase();
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                ctx.fillText(randomHex, x, y);
            }
        }

        const delay = ms => new Promise(res => setTimeout(res, ms));

        // 🎬 TIMELINE YA MATUKIO
        async function startSequence() {
            // Hatua ya 1: Mweko (Flash)
            for (let i = 0; i < 3; i++) {
                screen.style.backgroundColor = 'white';
                await delay(350);
                screen.style.backgroundColor = 'black';
                await delay(400);
            }

            // Hatua ya 2: Inabaki Nyeupe
            screen.style.backgroundColor = 'white';
            await delay(2000);

            // Hatua ya 3: Chengachenga na Msimbo wa Namba
            canvas.style.display = 'block';
            let noiseInterval = setInterval(drawSlowNoiseAndNumbers, 70);
            await delay(5000);

            // Hatua ya 4: Blackout
            clearInterval(noiseInterval);
            canvas.style.display = 'none';
            screen.style.backgroundColor = 'black';
            await delay(3500);

            // Hatua ya 5: PUUH! na Uonyesho wa Hazard Banner na ARE YOU SCARED?
            playPuuhSound();
            screen.style.backgroundColor = 'white';
            hazardBg.style.display = 'block';
            hackBanner.style.display = 'block';
            scaredText.style.display = 'block';

            // Hatua ya 6: Sauti ya "FINISHED!" na Kicheko
            await delay(1000);
            triggerVoiceAndLaugh();
        }

        // MTUMIAJI AKIGUSA SKRINI KWENYE SIMU AU KOMPYUTA
        window.addEventListener('click', () => triggerVoiceAndLaugh());
        window.addEventListener('touchstart', () => triggerVoiceAndLaugh());

        window.onload = () => {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
            }
            startSequence();
        };

        window.addEventListener('resize', resizeCanvas);
    </script>
</body>
</html>
